name: Update README Dashboard

on:
  schedule:
    - cron: '10 17 * * *'  # 每天北京时间凌晨 1:10 (UTC 17:10)，比小猫更新晚 10 分钟
  workflow_dispatch:        # 支持手动触发

concurrency:
  group: readme-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Update README stats
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Daily stats update" && git pull --rebase && git push)
